</div>
<div>

</div>

<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-bold rounded-lg transition-all active:scale-[0.98] shadow-lg shadow-primary/20 flex items-center justify-center gap-2 mt-4" type="submit">
